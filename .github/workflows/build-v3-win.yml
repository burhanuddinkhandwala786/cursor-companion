name: Build & Publish Windows Release

on:
  workflow_dispatch:
    inputs:
      summary:
        description: "What changed in this release?"
        required: false
        default: "UI polish, bug fixes, and stability improvements."
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Syntax check client files
        shell: pwsh
        run: |
          node --check main.js
          if (Test-Path preload.js) { node --check preload.js }

      - name: Read version from package.json
        id: meta
        shell: pwsh
        run: |
          $pkg = Get-Content -Raw -Path package.json | ConvertFrom-Json
          $ver = $pkg.version.Trim()
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_name=Cursor Companion V$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build Windows NSIS installer
        shell: pwsh
        run: npx electron-builder --win --x64 --publish never

      - name: Generate exact SHA-256 release notes
        shell: pwsh
        env:
          USER_SUMMARY: ${{ inputs.summary }}
        run: |
          $exe = Get-ChildItem -Path dist -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No .exe installer found in dist/"
            exit 1
          }
          $hash = (Get-FileHash -Path $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $ver = "${{ steps.meta.outputs.version }}"
          $bt = [char]96

          $notes = @(
            "## What's New in Cursor Companion v$ver"
            ""
            "$env:USER_SUMMARY"
            ""
            "### Verification & Trust"
            "- **File:** $bt$($exe.Name)$bt"
            "- **SHA-256:** $bt$hash$bt"
            "- **SmartScreen Note:** Unsigned open-source student build — click **More info -> Run anyway** to install, or verify the SHA-256 hash above directly on [VirusTotal](https://www.virustotal.com/gui/home/search)."
          ) -join "`n"

          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

          "### Release Built Successfully" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- **File:** $($exe.Name)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- **Tag:** v$ver" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- **SHA-256:** $bt$hash$bt" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Publish Latest GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.release_name }}
          body_path: release-notes.md
          prerelease: false
          make_latest: true
          files: dist/*.exe
