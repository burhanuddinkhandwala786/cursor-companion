name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers automatically on any git push tag starting with 'v' (e.g. v2.0.1)

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build and Package Electron App
        run: npm run build
        env:
          # If you have an optional GitHub token or environment variables, place them here
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Zip Archive of Installer
        shell: pwsh
        run: |
          $distPath = "dist"
          $exeFile = Get-ChildItem -Path $distPath -Filter "*.exe" | Select-Object -First 1
          if ($exeFile) {
            $zipName = $exeFile.Name -replace '\.exe$', '.zip'
            Compress-Archive -Path $exeFile.FullName -DestinationPath (Join-Path $distPath $zipName)
            Write-Host "Created archive: $zipName"
          }

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
