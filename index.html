<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Cursor Companion</title>
  <style>
    :root {
      --bg-glass: rgba(18, 18, 20, 0.86);
      --bg-card: rgba(28, 28, 30, 0.82);
      --bg-card-hover: rgba(44, 44, 46, 0.92);
      --border: rgba(255, 255, 255, 0.13);
      --border-hi: rgba(255, 255, 255, 0.22);
      --spec: inset 0 1px 0 rgba(255, 255, 255, 0.11);
      --ink: #f5f5f7;
      --ink-2: #a1a1a6;
      --ink-3: #6e6e73;
      --blue: #0071e3;
      --blue-hi: #2997ff;
      --green: #30d158;
      --amber: #ff9f0a;
      --gold: #e5c17b;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: var(--font);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .view { display: none; width: 100%; height: 100%; }
    .view.active { display: flex; }

    /* ================= HUD PILL (Whisper-Quiet Obsidian) ================= */
    #hudView {
      align-items: center;
      justify-content: flex-start;
      padding: 2px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 26px;
      max-width: 100%;
      padding: 0 10px 0 9px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(30, 30, 34, 0.9), rgba(14, 14, 16, 0.92));
      border: 1px solid var(--border);
      box-shadow: var(--spec), 0 8px 24px rgba(0, 0, 0, 0.45);
      animation: fadeSlide 0.16s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .pill.loading {
      padding: 0 12px;
      justify-content: center;
    }

    .pill.error {
      border-color: rgba(255, 159, 10, 0.32);
    }

    .pill.update {
      border-color: rgba(41, 151, 255, 0.42);
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--green);
      box-shadow: 0 0 6px rgba(48, 209, 88, 0.65);
    }
    .dot.pool { background: #d2d2d7; box-shadow: 0 0 5px rgba(255, 255, 255, 0.4); }
    .dot.pro { background: var(--gold); box-shadow: 0 0 6px rgba(229, 193, 123, 0.6); }
    .dot.cache { background: var(--blue-hi); box-shadow: 0 0 6px rgba(41, 151, 255, 0.6); }
    .dot.error { background: var(--amber); box-shadow: 0 0 6px rgba(255, 159, 10, 0.6); }
    .dot.update { background: var(--blue-hi); box-shadow: 0 0 7px rgba(41, 151, 255, 0.8); }

    .pill-text {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: -0.015em;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill-meta {
      font-size: 10px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--ink-3);
      flex-shrink: 0;
      padding-left: 3px;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
    }

    .pin-mark {
      font-size: 9px;
      color: var(--ink-2);
      flex-shrink: 0;
    }

    /* Breathing precision dots */
    .loader {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .loader i {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #d2d2d7;
      animation: breathe 1.05s ease-in-out infinite;
    }
    .loader i:nth-child(2) { animation-delay: 0.16s; }
    .loader i:nth-child(3) { animation-delay: 0.32s; }

    @keyframes breathe {
      0%, 80%, 100% { opacity: 0.22; transform: scale(0.85); }
      40% { opacity: 1; transform: scale(1.1); }
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(2px) scale(0.985); }
      to { opacity: 1; transform: none; }
    }

    /* ================= SPOTLIGHT BAR (Apple / Tesla Command Bar) ================= */
    #spotlightView {
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .spot-shell {
      width: 100%;
      height: 46px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px 0 14px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(28, 28, 32, 0.94), rgba(14, 14, 16, 0.96));
      border: 1px solid var(--border-hi);
      box-shadow: var(--spec), 0 16px 40px rgba(0, 0, 0, 0.65);
    }

    .spot-badge {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--ink);
      border: 1px solid rgba(255, 255, 255, 0.09);
      flex-shrink: 0;
    }
    .spot-badge.key { color: var(--gold); border-color: rgba(229, 193, 123, 0.25); background: rgba(229, 193, 123, 0.08); }
    .spot-badge.followup { color: var(--blue-hi); border-color: rgba(41, 151, 255, 0.28); background: rgba(41, 151, 255, 0.1); }

    .spot-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--ink);
      font-family: var(--font);
      font-size: 13.5px;
      font-weight: 400;
      letter-spacing: -0.01em;
    }
    .spot-input::placeholder { color: var(--ink-3); }

    .spot-kbd {
      font-size: 10px;
      font-weight: 600;
      color: var(--ink-3);
      padding: 3px 6px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    /* ================= STUDY SIDECAR (Machined Glass Blade) ================= */
    #sidecarView {
      padding: 4px;
    }

    .sidecar {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(22, 22, 24, 0.94), rgba(10, 10, 12, 0.96));
      border: 1px solid var(--border);
      box-shadow: var(--spec), 0 24px 56px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }

    .sc-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 14px 11px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sc-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sc-mark {
      width: 11px;
      height: 11px;
      background: #f5f5f7;
      clip-path: polygon(0 0, 100% 62%, 56% 68%, 78% 100%, 58% 100%, 38% 72%, 0 90%);
    }
    .sc-title {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--ink);
    }
    .sc-mode {
      font-size: 10px;
      font-weight: 500;
      color: var(--ink-3);
      margin-left: 2px;
    }

    .sc-close {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.07);
      color: var(--ink-2);
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.15s, color 0.15s;
    }
    .sc-close:hover { background: rgba(255, 255, 255, 0.16); color: #fff; }

    /* Update Banner inside Sidecar */
    .sc-update {
      display: none;
      margin: 10px 10px 0;
      padding: 10px 11px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(0, 113, 227, 0.2), rgba(41, 151, 255, 0.08));
      border: 1px solid rgba(41, 151, 255, 0.35);
      gap: 8px;
      flex-direction: column;
    }
    .sc-update.visible { display: flex; }
    .sc-update-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 600;
      color: #fff;
    }
    .sc-update-sub {
      font-size: 10.5px;
      color: #b4d8ff;
      line-height: 1.35;
    }
    .sc-update-actions {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }
    .sc-btn {
      font-family: var(--font);
      font-size: 10.5px;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      padding: 5px 11px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .sc-btn.primary { background: var(--blue); color: #fff; }
    .sc-btn.primary:hover { background: #0077ed; }
    .sc-btn.ghost { background: rgba(255, 255, 255, 0.09); color: var(--ink-2); }
    .sc-btn.ghost:hover { background: rgba(255, 255, 255, 0.16); color: #fff; }

    .sc-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .sc-list::-webkit-scrollbar { width: 4px; }
    .sc-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 4px; }

    .sc-empty {
      margin: auto;
      text-align: center;
      padding: 28px 18px;
      color: var(--ink-3);
      font-size: 12px;
      line-height: 1.5;
    }
    .sc-empty strong {
      display: block;
      color: var(--ink-2);
      font-weight: 500;
      margin-bottom: 4px;
    }

    .sc-item {
      padding: 10px 11px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.07);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .sc-item:hover {
      background: var(--bg-card-hover);
      border-color: rgba(255, 255, 255, 0.14);
    }
    .sc-item.active {
      border-color: rgba(41, 151, 255, 0.45);
      background: rgba(41, 151, 255, 0.08);
    }

    .sc-item-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .sc-ans {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--ink);
      line-height: 1.35;
      word-break: break-word;
    }
    .sc-copy {
      flex-shrink: 0;
      font-family: var(--font);
      font-size: 10px;
      font-weight: 500;
      padding: 3px 7px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: var(--ink-2);
      cursor: pointer;
    }
    .sc-copy:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

    .sc-note {
      margin-top: 5px;
      font-size: 11px;
      color: var(--ink-2);
      line-height: 1.4;
      word-break: break-word;
    }

    .sc-meta {
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      color: var(--ink-3);
    }

    .sc-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 13px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      font-size: 10.5px;
      color: var(--ink-3);
    }
    .sc-check-link {
      background: none;
      border: none;
      color: var(--ink-2);
      font-family: var(--font);
      font-size: 10.5px;
      cursor: pointer;
    }
    .sc-check-link:hover { color: var(--blue-hi); }
  </style>
</head>
<body>
  <!-- HUD PILL VIEW -->
  <div id="hudView" class="view">
    <div id="pill" class="pill">
      <span id="pillDot" class="dot"></span>
      <span id="pillLoader" class="loader" style="display:none;"><i></i><i></i><i></i></span>
      <span id="pillText" class="pill-text"></span>
      <span id="pillPin" class="pin-mark" style="display:none;">•</span>
      <span id="pillMeta" class="pill-meta" style="display:none;"></span>
    </div>
  </div>

  <!-- SPOTLIGHT VIEW -->
  <div id="spotlightView" class="view">
    <div class="spot-shell">
      <span id="spotBadge" class="spot-badge">Ask</span>
      <input id="spotInput" class="spot-input" type="text" autocomplete="off" spellcheck="false" placeholder="Ask anything..." />
      <span class="spot-kbd">⏎</span>
    </div>
  </div>

  <!-- SIDECAR VIEW -->
  <div id="sidecarView" class="view">
    <div class="sidecar">
      <div class="sc-head">
        <div class="sc-brand">
          <span class="sc-mark"></span>
          <span class="sc-title">Companion</span>
          <span id="scMode" class="sc-mode">Pool</span>
        </div>
        <button id="scClose" class="sc-close" type="button" title="Close (Esc)">×</button>
      </div>

      <div id="scUpdate" class="sc-update">
        <div class="sc-update-top">
          <span id="scUpdateTitle">Update Available</span>
          <span id="scUpdateVer" style="color:#64d2ff;font-size:10.5px;"></span>
        </div>
        <div id="scUpdateSub" class="sc-update-sub">A newer release is ready to install.</div>
        <div class="sc-update-actions">
          <button id="scUpdateBtn" class="sc-btn primary" type="button">Download ↗</button>
          <button id="scUpdateLater" class="sc-btn ghost" type="button">Later</button>
        </div>
      </div>

      <div id="scList" class="sc-list"></div>

      <div class="sc-foot">
        <span id="scVersion">v3.1.0</span>
        <button id="scCheckUpdate" class="sc-check-link" type="button">Check updates</button>
      </div>
    </div>
  </div>

  <script>
    const api = window.hud || window.electronAPI || window.api || {};
    const hash = (window.location.hash || "").replace("#", "").toLowerCase();

    const hudView = document.getElementById("hudView");
    const spotlightView = document.getElementById("spotlightView");
    const sidecarView = document.getElementById("sidecarView");

    if (hash === "spotlight") {
      spotlightView.classList.add("active");
    } else if (hash === "sidecar") {
      sidecarView.classList.add("active");
    } else {
      hudView.classList.add("active");
    }

    // ---------- HUD Pill Renderer ----------
    const pill = document.getElementById("pill");
    const pillDot = document.getElementById("pillDot");
    const pillLoader = document.getElementById("pillLoader");
    const pillText = document.getElementById("pillText");
    const pillPin = document.getElementById("pillPin");
    const pillMeta = document.getElementById("pillMeta");

    function renderHud(data) {
      if (!data) return;
      const isLoading = data.mode === "loading";
      const isError = data.mode === "error";
      const isUpdate = data.mode === "update";

      pill.className = "pill" + (isLoading ? " loading" : isError ? " error" : isUpdate ? " update" : "");

      if (isLoading) {
        pillDot.style.display = "none";
        pillLoader.style.display = "inline-flex";
        pillText.style.display = "none";
        pillPin.style.display = "none";
        pillMeta.style.display = "none";
        return;
      }

      pillLoader.style.display = "none";
      pillDot.style.display = "inline-block";
      pillText.style.display = "inline";
      pillText.textContent = String(data.cursor_pill || "");

      let dotClass = "dot";
      if (isError) dotClass += " error";
      else if (isUpdate) dotClass += " update";
      else if (data.key_source === "PRO") dotClass += " pro";
      else if (data.key_source === "CACHE" || data.key_source === "BYOK_CACHE") dotClass += " cache";
      else if (data.key_source === "BYOK" || data.key_source === "TEST") dotClass += "";
      else dotClass += " pool";
      pillDot.className = dotClass;

      pillPin.style.display = data.isPinned ? "inline" : "none";

      const metaParts = [];
      if (data.elapsed) metaParts.push(String(data.elapsed));
      if (data.key_source === "CACHE" || data.key_source === "BYOK_CACHE") metaParts.push("⚡");
      else if (data.key_source === "PRO") metaParts.push("PRO");

      if (metaParts.length) {
        pillMeta.textContent = metaParts.join(" ");
        pillMeta.style.display = "inline";
      } else {
        pillMeta.style.display = "none";
      }
    }

    // ---------- Spotlight Renderer ----------
    const spotBadge = document.getElementById("spotBadge");
    const spotInput = document.getElementById("spotInput");
    let currentSpotMode = "ask";

    function renderSpotlight(data) {
      currentSpotMode = (data && data.spotlightMode) || "ask";
      spotBadge.className = "spot-badge";

      if (currentSpotMode === "key") {
        spotBadge.textContent = "API Key";
        spotBadge.classList.add("key");
        spotInput.type = "password";
        spotInput.value = (data && data.userApiKey) || "";
        spotInput.placeholder = "Paste free key (gsk_ / AIza) or share:<KEY> • Empty = Cloud Pool";
      } else if (currentSpotMode === "followup") {
        spotBadge.textContent = "Follow-Up";
        spotBadge.classList.add("followup");
        spotInput.type = "text";
        spotInput.value = "";
        spotInput.placeholder = data && data.hasContext
          ? "Ask why, request steps, or verify last answer..."
          : "Ask any question...";
      } else {
        spotBadge.textContent = "Ask";
        spotInput.type = "text";
        spotInput.value = "";
        spotInput.placeholder = "Ask anything or paste a question...";
      }

      setTimeout(() => {
        spotInput.focus();
        spotInput.select();
      }, 15);
    }

    spotInput.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        e.preventDefault();
        if (api.closeSpotlight) api.closeSpotlight();
      } else if (e.key === "Enter") {
        e.preventDefault();
        const val = spotInput.value.trim();
        if (currentSpotMode === "key") {
          if (api.saveApiKey) api.saveApiKey(val);
        } else if (val) {
          if (currentSpotMode === "followup" && api.sendFollowup) api.sendFollowup(val);
          else if (api.sendSpotlightQuery) api.sendSpotlightQuery(val);
        }
      }
    });

    // ---------- Sidecar Renderer ----------
    const scMode = document.getElementById("scMode");
    const scList = document.getElementById("scList");
    const scClose = document.getElementById("scClose");
    const scUpdate = document.getElementById("scUpdate");
    const scUpdateVer = document.getElementById("scUpdateVer");
    const scUpdateSub = document.getElementById("scUpdateSub");
    const scUpdateBtn = document.getElementById("scUpdateBtn");
    const scUpdateLater = document.getElementById("scUpdateLater");
    const scVersion = document.getElementById("scVersion");
    const scCheckUpdate = document.getElementById("scCheckUpdate");
    let currentUpdateVersion = "";

    scClose.onclick = () => { if (api.closeSidecar) api.closeSidecar(); };
    scUpdateBtn.onclick = () => { if (api.openUpdate) api.openUpdate(); };
    scUpdateLater.onclick = () => {
      scUpdate.classList.remove("visible");
      if (api.dismissUpdate && currentUpdateVersion) api.dismissUpdate(currentUpdateVersion);
    };
    scCheckUpdate.onclick = () => {
      scCheckUpdate.textContent = "Checking...";
      if (api.checkUpdate) api.checkUpdate();
      setTimeout(() => { scCheckUpdate.textContent = "Check updates"; }, 2500);
    };

    function renderSidecar(data) {
      if (!data) return;
      scMode.textContent = data.hasUserKey ? "BYOK" : "Cloud Pool";
      if (data.appVersion) scVersion.textContent = "v" + String(data.appVersion);

      if (data.updateInfo && data.updateInfo.available && !data.updateInfo.dismissed) {
        currentUpdateVersion = String(data.updateInfo.version || "");
        scUpdateVer.textContent = "v" + currentUpdateVersion;
        scUpdateSub.textContent = data.updateInfo.notice || "New features & stability improvements ready.";
        scUpdate.classList.add("visible");
      } else {
        scUpdate.classList.remove("visible");
      }

      const items = Array.isArray(data.history) ? data.history : [];
      scList.textContent = "";

      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "sc-empty";
        const strong = document.createElement("strong");
        strong.textContent = "Ready when you are";
        const sub = document.createElement("span");
        sub.textContent = "Press F8 to scan, F9 for 2-corner snip, or Alt+C on highlighted text.";
        empty.appendChild(strong);
        empty.appendChild(sub);
        scList.appendChild(empty);
        return;
      }

      items.forEach((item, idx) => {
        const card = document.createElement("div");
        card.className = "sc-item" + (idx === data.activeIdx ? " active" : "");
        card.onclick = () => { if (api.selectHistory) api.selectHistory(idx); };

        const top = document.createElement("div");
        top.className = "sc-item-top";

        const ans = document.createElement("div");
        ans.className = "sc-ans";
        ans.textContent = String(item.cursor_pill || "");

        const copyBtn = document.createElement("button");
        copyBtn.className = "sc-copy";
        copyBtn.type = "button";
        copyBtn.textContent = "Copy";
        copyBtn.onclick = (e) => {
          e.stopPropagation();
          const val = String(item.copy_value || item.cursor_pill || "");
          if (api.copyText && val) api.copyText(val);
          copyBtn.textContent = "Copied";
          setTimeout(() => { copyBtn.textContent = "Copy"; }, 1200);
        };

        top.appendChild(ans);
        top.appendChild(copyBtn);
        card.appendChild(top);

        if (item.expanded_note) {
          const note = document.createElement("div");
          note.className = "sc-note";
          note.textContent = String(item.expanded_note);
          card.appendChild(note);
        }

        const meta = document.createElement("div");
        meta.className = "sc-meta";
        const src = document.createElement("span");
        src.textContent = String(item.sourceLabel || "").slice(0, 28);
        const timing = document.createElement("span");
        timing.textContent = [item.key_source || "POOL", item.elapsed || ""].filter(Boolean).join(" · ");
        meta.appendChild(src);
        meta.appendChild(timing);
        card.appendChild(meta);

        scList.appendChild(card);
      });
    }

    if (api.onState) {
      api.onState((data) => {
        if (hash === "spotlight") renderSpotlight(data);
        else if (hash === "sidecar") renderSidecar(data);
        else renderHud(data);
      });
    }
  </script>
</body>
</html>
