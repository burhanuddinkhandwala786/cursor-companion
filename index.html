<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Cursor Companion</title>
  <style>
    :root {
      --obsidian-top: rgba(24, 24, 27, 0.94);
      --obsidian-bot: rgba(11, 11, 13, 0.96);
      --surface-card: rgba(255, 255, 255, 0.04);
      --surface-card-hover: rgba(255, 255, 255, 0.08);
      --hairline: rgba(255, 255, 255, 0.13);
      --hairline-hi: rgba(255, 255, 255, 0.22);
      --bezel-outer: 0 0 0 1px rgba(0, 0, 0, 0.78);
      --bezel-top: inset 0 1px 0 rgba(255, 255, 255, 0.12);
      --ink: #f5f5f7;
      --ink-2: #a1a1a6;
      --ink-3: #6e6e73;
      --sapphire: #0a84ff;
      --emerald: #34d399;
      --champagne: #d4b47c;
      --amber: #ffb340;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: var(--font);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .view { display: none; width: 100%; height: 100%; }
    .view.active { display: flex; }

    /* ================= HUD PILL (Zero-Halo Machined Capsule) ================= */
    #hudView {
      align-items: center;
      justify-content: flex-start;
      padding: 2px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 30px;
      max-width: 100%;
      padding: 0 11px 0 10px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--obsidian-top) 0%, var(--obsidian-bot) 100%);
      border: 1px solid var(--hairline);
      box-shadow: var(--bezel-outer), var(--bezel-top);
      animation: pillEnter 0.14s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .pill.loading {
      padding: 0 14px;
      justify-content: center;
    }

    .pill.error {
      border-color: rgba(255, 179, 64, 0.34);
    }

    .pill.update {
      border-color: rgba(10, 132, 255, 0.42);
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--emerald);
    }
    .dot.pool { background: #c7c7cc; }
    .dot.pro { background: var(--champagne); }
    .dot.cache { background: #64d2ff; }
    .dot.error { background: var(--amber); }
    .dot.update { background: var(--sapphire); }

    .pill-text {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: -0.014em;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Engraved Source Badge (BYOK / POOL / PRO / CACHE) */
    .src-badge {
      display: inline-flex;
      align-items: center;
      height: 17px;
      padding: 0 6px;
      border-radius: 999px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #d1d1d6;
    }
    .src-badge.byok {
      color: #6ee7b7;
      background: rgba(52, 211, 153, 0.1);
      border-color: rgba(52, 211, 153, 0.28);
    }
    .src-badge.pro {
      color: #ebd09b;
      background: rgba(212, 180, 124, 0.12);
      border-color: rgba(212, 180, 124, 0.32);
    }
    .src-badge.cache {
      color: #7dd3fc;
      background: rgba(100, 210, 255, 0.1);
      border-color: rgba(100, 210, 255, 0.28);
    }
    .src-badge.update {
      color: #7dc4ff;
      background: rgba(10, 132, 255, 0.14);
      border-color: rgba(10, 132, 255, 0.35);
    }

    .pill-meta {
      font-size: 10px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--ink-3);
      flex-shrink: 0;
    }

    .pin-mark {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--ink-2);
      flex-shrink: 0;
    }

    /* Whisper-Quiet Breathing Dots */
    .loader {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .loader i {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #d2d2d7;
      animation: breathe 1.05s ease-in-out infinite;
    }
    .loader i:nth-child(2) { animation-delay: 0.16s; }
    .loader i:nth-child(3) { animation-delay: 0.32s; }

    @keyframes breathe {
      0%, 80%, 100% { opacity: 0.22; transform: scale(0.85); }
      40% { opacity: 1; transform: scale(1.08); }
    }
    @keyframes pillEnter {
      from { opacity: 0; transform: translateY(2px); }
      to { opacity: 1; transform: none; }
    }

    /* ================= SPOTLIGHT BAR (Precision Command Capsule) ================= */
    #spotlightView {
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .spot-shell {
      width: 100%;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 13px 0 14px;
      border-radius: 18px;
      background: linear-gradient(180deg, #1b1b1e 0%, #0e0e10 100%);
      border: 1px solid var(--hairline-hi);
      box-shadow: var(--bezel-outer), var(--bezel-top);
    }

    .spot-badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--ink);
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }
    .spot-badge.key {
      color: var(--champagne);
      border-color: rgba(212, 180, 124, 0.3);
      background: rgba(212, 180, 124, 0.1);
    }
    .spot-badge.followup {
      color: #7dc4ff;
      border-color: rgba(10, 132, 255, 0.32);
      background: rgba(10, 132, 255, 0.12);
    }

    .spot-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--ink);
      font-family: var(--font);
      font-size: 13.5px;
      font-weight: 400;
      letter-spacing: -0.01em;
    }
    .spot-input::placeholder { color: var(--ink-3); }

    .spot-hints {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .spot-kbd {
      font-size: 10px;
      font-weight: 600;
      color: var(--ink-2);
      padding: 3px 7px;
      border-radius: 6px;
      background: linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04));
      border: 1px solid rgba(255, 255, 255, 0.11);
    }

    /* ================= STUDY SIDECAR (Obsidian Glass Blade) ================= */
    #sidecarView {
      padding: 4px;
    }

    .sidecar {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-radius: 22px;
      background: linear-gradient(180deg, #17171a 0%, #0b0b0d 100%);
      border: 1px solid var(--hairline);
      box-shadow: var(--bezel-outer), var(--bezel-top);
      overflow: hidden;
    }

    .sc-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sc-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sc-mark {
      width: 11px;
      height: 11px;
      background: #f5f5f7;
      clip-path: polygon(0 0, 100% 62%, 56% 68%, 78% 100%, 58% 100%, 38% 72%, 0 90%);
    }
    .sc-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .sc-close {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.05);
      color: var(--ink-2);
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.15s, color 0.15s;
    }
    .sc-close:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }

    /* Update Banner inside Sidecar */
    .sc-update {
      display: none;
      margin: 10px 12px 0;
      padding: 11px 12px;
      border-radius: 15px;
      background: linear-gradient(135deg, rgba(10, 132, 255, 0.16), rgba(10, 132, 255, 0.05));
      border: 1px solid rgba(10, 132, 255, 0.32);
      gap: 7px;
      flex-direction: column;
    }
    .sc-update.visible { display: flex; }
    .sc-update-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 600;
      color: #fff;
    }
    .sc-update-sub {
      font-size: 10.5px;
      color: #b4d8ff;
      line-height: 1.4;
    }
    .sc-update-actions {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }
    .sc-btn {
      font-family: var(--font);
      font-size: 10.5px;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      padding: 5px 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .sc-btn.primary { background: #0071e3; color: #fff; }
    .sc-btn.primary:hover { background: #0077ed; }
    .sc-btn.ghost { background: rgba(255, 255, 255, 0.08); color: var(--ink-2); }
    .sc-btn.ghost:hover { background: rgba(255, 255, 255, 0.16); color: #fff; }

    .sc-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sc-list::-webkit-scrollbar { width: 4px; }
    .sc-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 999px; }

    .sc-empty {
      margin: auto;
      text-align: center;
      padding: 28px 18px;
      color: var(--ink-3);
      font-size: 12px;
      line-height: 1.55;
    }
    .sc-empty strong {
      display: block;
      color: var(--ink-2);
      font-weight: 500;
      margin-bottom: 5px;
    }

    .sc-item {
      padding: 11px 12px;
      border-radius: 15px;
      background: var(--surface-card);
      border: 1px solid rgba(255, 255, 255, 0.07);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .sc-item:hover {
      background: var(--surface-card-hover);
      border-color: rgba(255, 255, 255, 0.14);
    }
    .sc-item.active {
      border-color: rgba(10, 132, 255, 0.42);
      background: rgba(10, 132, 255, 0.08);
    }

    .sc-item-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .sc-ans {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--ink);
      line-height: 1.38;
      word-break: break-word;
    }
    .sc-copy {
      flex-shrink: 0;
      font-family: var(--font);
      font-size: 10px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.11);
      background: rgba(255, 255, 255, 0.05);
      color: var(--ink-2);
      cursor: pointer;
    }
    .sc-copy:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

    .sc-note {
      margin-top: 6px;
      font-size: 11px;
      color: var(--ink-2);
      line-height: 1.42;
      word-break: break-word;
    }

    .sc-meta {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      color: var(--ink-3);
    }
    .sc-meta-right {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .sc-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 10.5px;
      color: var(--ink-3);
    }
    .sc-check-link {
      background: none;
      border: none;
      color: var(--ink-2);
      font-family: var(--font);
      font-size: 10.5px;
      cursor: pointer;
    }
    .sc-check-link:hover { color: #7dc4ff; }
  </style>
</head>
<body>
  <!-- HUD PILL VIEW -->
  <div id="hudView" class="view">
    <div id="pill" class="pill">
      <span id="pillDot" class="dot"></span>
      <span id="pillLoader" class="loader" style="display:none;"><i></i><i></i><i></i></span>
      <span id="pillText" class="pill-text"></span>
      <span id="pillSource" class="src-badge" style="display:none;"></span>
      <span id="pillMeta" class="pill-meta" style="display:none;"></span>
      <span id="pillPin" class="pin-mark" style="display:none;" title="Pinned"></span>
    </div>
  </div>

  <!-- SPOTLIGHT VIEW -->
  <div id="spotlightView" class="view">
    <div class="spot-shell">
      <span id="spotBadge" class="spot-badge">Ask</span>
      <input id="spotInput" class="spot-input" type="text" autocomplete="off" spellcheck="false" placeholder="Ask anything..." />
      <span class="spot-hints">
        <span class="spot-kbd">Enter</span>
        <span class="spot-kbd">Esc</span>
      </span>
    </div>
  </div>

  <!-- SIDECAR VIEW -->
  <div id="sidecarView" class="view">
    <div class="sidecar">
      <div class="sc-head">
        <div class="sc-brand">
          <span class="sc-mark"></span>
          <span class="sc-title">Companion</span>
          <span id="scMode" class="src-badge">POOL</span>
        </div>
        <button id="scClose" class="sc-close" type="button" title="Close (Esc)">×</button>
      </div>

      <div id="scUpdate" class="sc-update">
        <div class="sc-update-top">
          <span>Update Available</span>
          <span id="scUpdateVer" style="color:#7dc4ff;font-size:10.5px;"></span>
        </div>
        <div id="scUpdateSub" class="sc-update-sub">A newer release is ready to install.</div>
        <div class="sc-update-actions">
          <button id="scUpdateBtn" class="sc-btn primary" type="button">Download ↗</button>
          <button id="scUpdateLater" class="sc-btn ghost" type="button">Later</button>
        </div>
      </div>

      <div id="scList" class="sc-list"></div>

      <div class="sc-foot">
        <span id="scVersion">v3.1.1</span>
        <button id="scCheckUpdate" class="sc-check-link" type="button">Check updates</button>
      </div>
    </div>
  </div>

  <script>
    const api = window.hud || window.electronAPI || window.api || {};
    const hash = (window.location.hash || "").replace("#", "").toLowerCase();

    const hudView = document.getElementById("hudView");
    const spotlightView = document.getElementById("spotlightView");
    const sidecarView = document.getElementById("sidecarView");

    if (hash === "spotlight") {
      spotlightView.classList.add("active");
    } else if (hash === "sidecar") {
      sidecarView.classList.add("active");
    } else {
      hudView.classList.add("active");
    }

    function resolveSourceBadge(source, mode) {
      if (mode === "update") return { label: "UPDATE", cls: "update", dot: "update" };
      const s = String(source || "").toUpperCase();
      if (s === "BYOK") return { label: "BYOK", cls: "byok", dot: "" };
      if (s === "BYOK_CACHE") return { label: "BYOK ⚡", cls: "byok", dot: "" };
      if (s === "PRO") return { label: "PRO", cls: "pro", dot: "pro" };
      if (s === "CACHE") return { label: "POOL ⚡", cls: "cache", dot: "cache" };
      if (s === "POOL") return { label: "POOL", cls: "", dot: "pool" };
      if (s === "TEST") return { label: "TEST", cls: "", dot: "pool" };
      return null;
    }

    // ---------- HUD Pill Renderer ----------
    const pill = document.getElementById("pill");
    const pillDot = document.getElementById("pillDot");
    const pillLoader = document.getElementById("pillLoader");
    const pillText = document.getElementById("pillText");
    const pillSource = document.getElementById("pillSource");
    const pillMeta = document.getElementById("pillMeta");
    const pillPin = document.getElementById("pillPin");

    function renderHud(data) {
      if (!data) return;
      const isLoading = data.mode === "loading";
      const isError = data.mode === "error";
      const isUpdate = data.mode === "update";

      pill.className = "pill" + (isLoading ? " loading" : isError ? " error" : isUpdate ? " update" : "");

      if (isLoading) {
        pillDot.style.display = "none";
        pillLoader.style.display = "inline-flex";
        pillText.style.display = "none";
        pillSource.style.display = "none";
        pillMeta.style.display = "none";
        pillPin.style.display = "none";
        return;
      }

      pillLoader.style.display = "none";
      pillDot.style.display = "inline-block";
      pillText.style.display = "inline";
      pillText.textContent = String(data.cursor_pill || "");

      const badge = resolveSourceBadge(data.key_source, data.mode);
      if (badge) {
        pillSource.textContent = badge.label;
        pillSource.className = "src-badge" + (badge.cls ? " " + badge.cls : "");
        pillSource.style.display = "inline-flex";
      } else {
        pillSource.style.display = "none";
      }

      let dotClass = "dot";
      if (isError) dotClass += " error";
      else if (badge && badge.dot) dotClass += " " + badge.dot;
      else if (!badge) dotClass += " pool";
      pillDot.className = dotClass;

      if (data.elapsed) {
        pillMeta.textContent = String(data.elapsed);
        pillMeta.style.display = "inline";
      } else {
        pillMeta.style.display = "none";
      }

      pillPin.style.display = data.isPinned ? "inline-block" : "none";
    }

    // ---------- Spotlight Renderer ----------
    const spotBadge = document.getElementById("spotBadge");
    const spotInput = document.getElementById("spotInput");
    let currentSpotMode = "ask";

    function renderSpotlight(data) {
      currentSpotMode = (data && data.spotlightMode) || "ask";
      spotBadge.className = "spot-badge";

      if (currentSpotMode === "key") {
        spotBadge.textContent = "API Key";
        spotBadge.classList.add("key");
        spotInput.type = "password";
        spotInput.value = (data && data.userApiKey) || "";
        spotInput.placeholder = "Paste free key (gsk_ / AIza) or share:<KEY> · Empty = Cloud Pool";
      } else if (currentSpotMode === "followup") {
        spotBadge.textContent = "Follow-Up";
        spotBadge.classList.add("followup");
        spotInput.type = "text";
        spotInput.value = "";
        spotInput.placeholder = data && data.hasContext
          ? "Ask why, request steps, or verify last answer..."
          : "Ask any question...";
      } else {
        spotBadge.textContent = "Ask";
        spotInput.type = "text";
        spotInput.value = "";
        spotInput.placeholder = "Ask anything or paste a question...";
      }

      setTimeout(() => {
        spotInput.focus();
        spotInput.select();
      }, 15);
    }

    spotInput.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        e.preventDefault();
        if (api.closeSpotlight) api.closeSpotlight();
      } else if (e.key === "Enter") {
        e.preventDefault();
        const val = spotInput.value.trim();
        if (currentSpotMode === "key") {
          if (api.saveApiKey) api.saveApiKey(val);
        } else if (val) {
          if (currentSpotMode === "followup" && api.sendFollowup) api.sendFollowup(val);
          else if (api.sendSpotlightQuery) api.sendSpotlightQuery(val);
        }
      }
    });

    // ---------- Sidecar Renderer ----------
    const scMode = document.getElementById("scMode");
    const scList = document.getElementById("scList");
    const scClose = document.getElementById("scClose");
    const scUpdate = document.getElementById("scUpdate");
    const scUpdateVer = document.getElementById("scUpdateVer");
    const scUpdateSub = document.getElementById("scUpdateSub");
    const scUpdateBtn = document.getElementById("scUpdateBtn");
    const scUpdateLater = document.getElementById("scUpdateLater");
    const scVersion = document.getElementById("scVersion");
    const scCheckUpdate = document.getElementById("scCheckUpdate");
    let currentUpdateVersion = "";

    scClose.onclick = () => { if (api.closeSidecar) api.closeSidecar(); };
    scUpdateBtn.onclick = () => { if (api.openUpdate) api.openUpdate(); };
    scUpdateLater.onclick = () => {
      scUpdate.classList.remove("visible");
      if (api.dismissUpdate && currentUpdateVersion) api.dismissUpdate(currentUpdateVersion);
    };
    scCheckUpdate.onclick = () => {
      scCheckUpdate.textContent = "Checking...";
      if (api.checkUpdate) api.checkUpdate();
      setTimeout(() => { scCheckUpdate.textContent = "Check updates"; }, 2500);
    };

    function renderSidecar(data) {
      if (!data) return;
      if (data.hasUserKey) {
        scMode.textContent = "BYOK";
        scMode.className = "src-badge byok";
      } else {
        scMode.textContent = "POOL";
        scMode.className = "src-badge";
      }
      if (data.appVersion) scVersion.textContent = "v" + String(data.appVersion);

      if (data.updateInfo && data.updateInfo.available && !data.updateInfo.dismissed) {
        currentUpdateVersion = String(data.updateInfo.version || "");
        scUpdateVer.textContent = "v" + currentUpdateVersion;
        scUpdateSub.textContent = data.updateInfo.notice || "New features and stability improvements ready.";
        scUpdate.classList.add("visible");
      } else {
        scUpdate.classList.remove("visible");
      }

      const items = Array.isArray(data.history) ? data.history : [];
      scList.textContent = "";

      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "sc-empty";
        const strong = document.createElement("strong");
        strong.textContent = "Ready when you are";
        const sub = document.createElement("span");
        sub.textContent = "Press F8 to scan, F9 for 2-corner snip, or Alt+C on highlighted text.";
        empty.appendChild(strong);
        empty.appendChild(sub);
        scList.appendChild(empty);
        return;
      }

      items.forEach((item, idx) => {
        const card = document.createElement("div");
        card.className = "sc-item" + (idx === data.activeIdx ? " active" : "");
        card.onclick = () => { if (api.selectHistory) api.selectHistory(idx); };

        const top = document.createElement("div");
        top.className = "sc-item-top";

        const ans = document.createElement("div");
        ans.className = "sc-ans";
        ans.textContent = String(item.cursor_pill || "");

        const copyBtn = document.createElement("button");
        copyBtn.className = "sc-copy";
        copyBtn.type = "button";
        copyBtn.textContent = "Copy";
        copyBtn.onclick = (e) => {
          e.stopPropagation();
          const val = String(item.copy_value || item.cursor_pill || "");
          if (api.copyText && val) api.copyText(val);
          copyBtn.textContent = "Copied";
          setTimeout(() => { copyBtn.textContent = "Copy"; }, 1200);
        };

        top.appendChild(ans);
        top.appendChild(copyBtn);
        card.appendChild(top);

        if (item.expanded_note) {
          const note = document.createElement("div");
          note.className = "sc-note";
          note.textContent = String(item.expanded_note);
          card.appendChild(note);
        }

        const meta = document.createElement("div");
        meta.className = "sc-meta";
        const src = document.createElement("span");
        src.textContent = String(item.sourceLabel || "").slice(0, 24);

        const right = document.createElement("span");
        right.className = "sc-meta-right";
        const bInfo = resolveSourceBadge(item.key_source || "POOL", "result");
        if (bInfo) {
          const b = document.createElement("span");
          b.className = "src-badge" + (bInfo.cls ? " " + bInfo.cls : "");
          b.textContent = bInfo.label;
          right.appendChild(b);
        }
        if (item.elapsed) {
          const t = document.createElement("span");
          t.textContent = String(item.elapsed);
          right.appendChild(t);
        }

        meta.appendChild(src);
        meta.appendChild(right);
        card.appendChild(meta);

        scList.appendChild(card);
      });
    }

    if (api.onState) {
      api.onState((data) => {
        if (hash === "spotlight") renderSpotlight(data);
        else if (hash === "sidecar") renderSidecar(data);
        else renderHud(data);
      });
    }
  </script>
</body>
</html>
